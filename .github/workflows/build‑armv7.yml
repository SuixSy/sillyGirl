name: Build K3‑armv7 binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sillyGirl for K3(armv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve dev version
        id: vars
        shell: bash
        run: |
          version="dev‑${GITHUB_SHA::7}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Build linux/arm GOARM=7 (K3)
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          ldflags="-s -w -X github.com/smallfawn/sillyGirl/core.compiled_at=${VERSION}"

          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/sillyGirl_linux_armv7" .

          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/storage‑migrate_linux_armv7" ./cmd/storage‑migrate

          cp build/sillyGirl_linux_armv7 build/storage‑migrate_linux_armv7 dist/
          (cd dist && sha256sum sillyGirl_* storage‑migrate_* > checksums.txt)

      - name: Upload artifact
        uses: actions/upload‑artifact@v7
        with:
          name: sillyGirl‑K3‑armv7
          path: dist/*
