name: Build sillyGirl armv7(K3)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5

      - name: 安装Node22编译admin前端
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd admin
          npm install
          npm run build
          cd ..

      - name: 安装Go编译器
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 交叉编译 Linux‑armv7 静态二进制(K3 cortex‑a9)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm
          GOARM: 7
        run: |
          go build -ldflags "-w -s" -o sillygirl-k3-armv7 .

      - name: 下载编译产物
        uses: actions/upload-artifact@v4
        with:
          name: sillygirl-k3-armv7-bin
          path: sillygirl-k3-armv7
