name: Build sillyGirl armv7(K3 ipq806x)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5

      - name: 安装Go编译器
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 交叉编译，针对ipq806x cortex‑A9，关闭硬件除法
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          GODEBUG: cpu.divhardware=0
        run: |
          go build -ldflags "-w -s" -o sillygirl-k3-armv7 .

      - name: 下载编译产物
        uses: actions/upload-artifact@v4
        with:
          name: sillygirl-k3-armv7-bin
          path: sillygirl-k3-armv7
