name: Build K3‑armv7 binary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sillyGirl for K3(Cortex‑A9 VFPv3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve dev version
        id: vars
        shell: bash
        run: |
          version="dev-${GITHUB_SHA::7}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install cross‑gcc for armhf
        run: |
          sudo apt update
          sudo apt install -y gcc‑arm‑linux‑gnueabihf

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Build for K3 Cortex‑A9 VFPv3
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 1
          CC: arm‑linux‑gnueabihf‑gcc
          CGO_CFLAGS: "-march=armv7‑a -mtune=cortex‑a9 -mfpu=vfpv3‑d16 -mfloat‑abi=hard"
        run: |
          set -euo pipefail
          mkdir -p dist build
          ldflags="-s -w -X github.com/smallfawn/sillyGirl/core.compiled_at=${VERSION}"

          go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/sillyGirl_linux_armv7l" .

          go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/storage‑migrate_linux_armv7l" ./cmd/storage‑migrate

          cp build/sillyGirl_linux_armv7l build/storage‑migrate_linux_armv7l dist/
          (cd dist && sha256sum sillyGirl_* storage‑migrate_* > checksums.txt)

      - name: Upload artifact
        uses: actions/upload‑artifact@v7
        with:
          name: sillyGirl‑K3‑armv7l
          path: dist/*
