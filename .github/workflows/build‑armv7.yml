name: Build armv7 binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup‑go@v5
        with:
          go‑version: "1.23"

      - name: Compile for K3 linux/armv7
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o sillyGirl_linux_armv7

      - name: Upload artifact
        uses: actions/upload‑artifact@v4
        with:
          name: sillyGirl‑armv7
          path: sillyGirl_linux_armv7
