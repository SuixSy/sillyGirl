name: Build‑K3‑Go121‑armv7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs‑on: ubuntu‑latest
    steps:
      ‑ uses: actions/checkout@v4

      ‑ name: Setup Go 1.21.13
        uses: actions/setup‑go@v4
        with:
          go‑version: "1.21.13"

      ‑ name: compile armv7 musl static(no‑neon for K3)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: |
          mkdir dist
          go build ‑trimpath ‑ldflags="-s -w" ‑o ./dist/sillyGirl_linux_armv7 .
          go build ‑trimpath ‑ldflags="-s -w" ‑o ./dist/storage‑migrate ./cmd/storage‑migrate

      ‑ name: upload artifact
        uses: actions/upload‑artifact@v4
        with:
          name: sillygirl‑k3‑armv7‑go121
          path: dist/
