name: Build K3-armv7 musl static

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sillyGirl K3 Cortex-A9 no-neon musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          version="dev-${GITHUB_SHA::7}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          zig-version: 0.14.0

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Build static musl armv7 no-neon
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 1
          CC: zig cc
          CGO_CFLAGS: "-target arm-linux-musleabihf -march=armv7-a -mtune=cortex-a9 -mfpu=vfpv3-d16"
          CGO_LDFLAGS: "-static"
        run: |
          set -euo pipefail
          mkdir -p dist build
          ldflags="-s -w -X github.com/smallfawn/sillyGirl/core.compiled_at=${VERSION}"

          go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/sillyGirl_linux_armv7l_musl" .

          go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o "build/storage-migrate_linux_armv7l_musl" ./cmd/storage-migrate

          cp build/sillyGirl_linux_armv7l_musl build/storage-migrate_linux_armv7l_musl dist/
          (cd dist && sha256sum sillyGirl_* storage-migrate_* > checksums.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sillyGirl-K3-armv7l-musl
          path: dist/*
